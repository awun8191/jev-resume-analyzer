[project]
name = "jev-resume-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "defusedxml>=0.7,<1",
  "pdfplumber>=0.11,<0.12",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "reportlab>=4,<5",
    "ruff>=0.11,<1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["live: explicitly authorized billable test through running localhost API"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
